# XcodeGen spec: the build workflow turns this into Kite.xcodeproj (`xcodegen generate`).
name: Kite
options:
  bundleIdPrefix: app.vela
  deploymentTarget:
    iOS: "16.0"
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.0.0
  VelaCore:
    path: VelaCore
targets:
  Kite:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Assets.xcassets
      - Shared
    dependencies:
      - package: MapLibre
      - package: VelaCore
      # The next turn on the lock screen and in the Dynamic Island.
      - target: KiteWidget
        embed: true
    scheme: {}
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Kite
        CFBundleShortVersionString: "0.7.17"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSLocationWhenInUseUsageDescription: Kite shows where you are on the map, finds places near you and guides you turn by turn.
        NSLocationAlwaysAndWhenInUseUsageDescription: Kite keeps guiding you with the screen off during navigation.
        NSMicrophoneUsageDescription: Kite listens when you tap the microphone to search by voice.
        NSSpeechRecognitionUsageDescription: Kite turns what you say into a search.
        NSBluetoothAlwaysUsageDescription: Kite sends turn-by-turn navigation cues to your nearby MiniNav display.
        UIBackgroundModes:
          - location
          - audio
          - bluetooth-central
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        # Kept from the Vela days so updates install over the old app and keep saved places.
        PRODUCT_BUNDLE_IDENTIFIER: app.vela.ios
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.7.17"
        CURRENT_PROJECT_VERSION: "1"
  KiteWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - Widget
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Kite
        CFBundleShortVersionString: "0.7.17"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vela.ios.NavigationWidget
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.7.17"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES
